// weight: new=3, struggling(<50%)=2~3, learning(<80%)=1, mastered(>=80%)=0.3
function itemWeight(stat) {
  if (!stat || stat.attempts === 0) return 3;
  var acc = stat.correct / stat.attempts;
  if (acc < 0.5) return 2 + (1 - acc) * 2;
  if (acc < 0.8) return 1.2;
  return 0.3;
}
function weightedPick(items, stats) {
  var weights = items.map(function (_, i) {
    return itemWeight(stats[i]);
  });
  var total = weights.reduce(function (a, b) {
    return a + b;
  }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return items.length - 1;
}
function masteryLevel(stat) {
  if (!stat || stat.attempts === 0) return "new";
  var acc = stat.correct / stat.attempts;
  if (acc >= 0.8 && stat.attempts >= 3) return "mastered";
  if (acc >= 0.5) return "learning";

}

    contentJp: "\u79c1\u305f\u3061\u304c\u4f55\u8005\u3067\u3001\u306a\u305c\u305d\u308c\u304c\u91cd\u8981\u304b\u3092\u304a\u5ba2\u69d8\u306b\u4f1d\u3048\u307e\u3057\u3087\u3046\u3002\n\n\u30fb\u79c1\u305f\u3061\u306f\u30d9\u30eb\u30ea\u30f3\u767a\u306e\u72ec\u7acb\u3057\u305f\u30a2\u30a4\u30a6\u30a7\u30a2\u30d6\u30e9\u30f3\u30c9\u3067\u3059\u3002\n\n\u30fbMYKITA\u306e\u30d5\u30ec\u30fc\u30e0\u306f\u3059\u3079\u3066\u3001\u30d9\u30eb\u30ea\u30f3\u306eMYKITA HAUS\u3068\u3044\u3046\u4e00\u3064\u5c4b\u6839\u306e\u4e0b\u3067\u30c7\u30b6\u30a4\u30f3\u304b\u3089\u88fd\u9020\u307e\u3067\u884c\u3063\u3066\u3044\u307e\u3059\u3002\n\n\u30fb\u6700\u5148\u7aef\u306e\u30c6\u30af\u30ce\u30ed\u30b8\u30fc\u3068\u4e01\u5be7\u306a\u624b\u4ed5\u4e8b\u3092\u7d44\u307f\u5408\u308f\u305b\u3066\u3044\u308b \u2014 \u305d\u308c\u304c\u79c1\u305f\u3061\u306e\u88fd\u54c1\u3092\u30e6\u30cb\u30fc\u30af\u306b\u3057\u3066\u3044\u308b\u3082\u306e\u3067\u3059\u3002\n\n\u30fb\u81ea\u7136\u4f53\u3067\u81ea\u4fe1\u3092\u6301\u3063\u3066\u3002\u53f0\u672c\u901a\u308a\u3067\u306f\u306a\u304f\u3001\u305d\u308c\u304c\u79c1\u305f\u3061\u306e\u30a2\u30a4\u30c7\u30f3\u30c6\u30a3\u30c6\u30a3\u3067\u3059\u3002",
    keyPhrases: [{
      en: "We are an independent eyewear brand from Berlin.",

  origin: {
    title: "Brand Origin",
    content: "MYKITA was founded in Berlin, Germany in 2003. The name comes from 'Kita' \u2014 a German abbreviation for Kindertagesst\u00e4tte (day nursery), referencing the brand's first premises in a former day care center. Founder Moritz Kr\u00fcger has described the name as reflecting a spirit of curiosity and playfulness.",
    contentJp: "MYKITA\u306f2003\u5e74\u306b\u30c9\u30a4\u30c4\u30fb\u30d9\u30eb\u30ea\u30f3\u3067\u8a2d\u7acb\u3055\u308c\u307e\u3057\u305f\u3002\u30d6\u30e9\u30f3\u30c9\u540d\u306f\u300cKita\u300d\u306b\u7531\u6765\u3057\u3066\u304a\u308a\u3001\u30c9\u30a4\u30c4\u8a9e\u3067\u4fdd\u80b2\u6240\uff08Kindertagesst\u00e4tte\uff09\u306e\u7565\u79f0\u3067\u3059\u3002\u304b\u3064\u3066\u4fdd\u80b2\u6240\u3060\u3063\u305f\u5efa\u7269\u306b\u6700\u521d\u306e\u62e0\u70b9\u3092\u69cb\u3048\u305f\u3053\u3068\u306b\u7531\u6765\u3057\u307e\u3059\u3002\u5275\u8a2d\u8005\u306e\u30e2\u30fc\u30ea\u30c3\u30c4\u30fb\u30af\u30ea\u30e5\u30fc\u30ac\u30fc\u306f\u3001\u3053\u306e\u540d\u524d\u304c\u597d\u5947\u5fc3\u3068\u904a\u3073\u5fc3\u306e\u7cbe\u795e\u3092\u8868\u3057\u3066\u3044\u308b\u3068\u8a9e\u3063\u3066\u3044\u307e\u3059\u3002",
    keyPhrases: [{
      en: "Founded in Berlin in 2003",
      jp: "2003\u5e74\u306b\u30d9\u30eb\u30ea\u30f3\u3067\u5275\u696d"
    }, {
      en: "All frames are hand-assembled at MYKITA HAUS",
      jp: "\u5168\u30d5\u30ec\u30fc\u30e0\u306fMYKITA HAUS\u3067\u624b\u7d44\u307f"
    }, {

  philosophy: {
    title: "Design Philosophy",
    content: "MYKITA brings together cutting-edge engineering and traditional craftsmanship under one roof. Every product goes through every stage of development in-house \u2014 from concept to shop floor \u2014 ensuring uncompromising quality. MYKITA describes itself as a 'modern manufactory' driven by a collective impulse to challenge the status quo.",
    contentJp: "MYKITA\u306f\u6700\u5148\u7aef\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u3068\u4f1d\u7d71\u7684\u306a\u8077\u4eba\u6280\u3092\u4e00\u3064\u5c4b\u6839\u306e\u4e0b\u306b\u96c6\u7d50\u3055\u305b\u3066\u3044\u307e\u3059\u3002\u3059\u3079\u3066\u306e\u88fd\u54c1\u306f\u3001\u30b3\u30f3\u30bb\u30d7\u30c8\u304b\u3089\u5e97\u982d\u306b\u4e26\u3076\u307e\u3067\u3001\u958b\u767a\u306e\u3042\u3089\u3086\u308b\u6bb5\u968e\u3092\u793e\u5185\u3067\u4e00\u8cab\u3057\u3066\u884c\u3044\u3001\u59a5\u5354\u306e\u306a\u3044\u54c1\u8cea\u3092\u4fdd\u8a3c\u3057\u3066\u3044\u307e\u3059\u3002MYKITA\u306f\u81ea\u793e\u3092\u300c\u73fe\u4ee3\u306e\u5de5\u623f\uff08\u30e2\u30c0\u30f3\u30fb\u30de\u30cb\u30e5\u30d5\u30a1\u30af\u30c8\u30ea\u30fc\uff09\u300d\u3068\u79f0\u3057\u3001\u73fe\u72b6\u306b\u6311\u6226\u3059\u308b\u96c6\u56e3\u7684\u306a\u885d\u52d5\u306b\u7a81\u304d\u52d5\u304b\u3055\u308c\u3066\u3044\u307e\u3059\u3002",
    keyPhrases: [{

    }]

  sustainability: {
    title: "Sustainability & Responsible Design",
    content: "MYKITA's approach to sustainability is built on four principles present in every frame: timeless aesthetic, ethical production, pioneering design, and handcrafted quality. All stainless steel frames \u2014 across the No1, LITE, DECADES, LESSRIM, and Studio collections \u2014 are made from Swedish spring steel with 90% recycled content, with 10% virgin raw material added to achieve medical-grade quality. In 2022, MYKITA became the first brand in the eyewear industry to completely switch its entire acetate supply to Eastman Acetate Renew \u2014 an ISCC PLUS certified material made from 60% sustainably sourced wood pulp and 40% certified recycled waste plastics. Compared to conventional acetate, Acetate Renew reduces greenhouse gas emissions by up to 50%. MYKITA MYLON frames are produced via selective laser sintering (SLS), a 3D printing process in which any unused polyamide powder is fully recycled \u2014 generating zero material waste. All frames are made to order at MYKITA HAUS in Berlin, minimising overproduction. The complimentary MYCARE service available at all MYKITA shops worldwide is designed to extend the lifespan of every frame through repair and maintenance, reinforcing a philosophy of responsible consumption.",
    contentJp: "MYKITA\u306e\u30b5\u30b9\u30c6\u30ca\u30d3\u30ea\u30c6\u30a3\u3078\u306e\u53d6\u308a\u7d44\u307f\u306f\u3001\u3059\u3079\u3066\u306e\u30d5\u30ec\u30fc\u30e0\u306b\u5bbf\u308b4\u3064\u306e\u539f\u5247\u306b\u57fa\u3065\u3044\u3066\u3044\u307e\u3059\u3002\u305d\u308c\u306f\u300c\u30bf\u30a4\u30e0\u30ec\u30b9\u306a\u7f8e\u5b66\u300d\u300c\u502b\u7406\u7684\u306a\u751f\u7523\u300d\u300c\u5148\u99c6\u7684\u306a\u30c7\u30b6\u30a4\u30f3\u300d\u300c\u624b\u5de5\u82b8\u306e\u54c1\u8cea\u300d\u3067\u3059\u3002No1\u30fbLITE\u30fbDECADES\u30fbLESSRIM\u30fbStudio\u30b3\u30ec\u30af\u30b7\u30e7\u30f3\u306e\u3059\u3079\u3066\u306e\u30b9\u30c6\u30f3\u30ec\u30b9\u30d5\u30ec\u30fc\u30e0\u306f\u3001\u30b9\u30a6\u30a7\u30fc\u30c7\u30f3\u7523\u30b9\u30d7\u30ea\u30f3\u30b0\u30b9\u30c1\u30fc\u30eb\u3092\u4f7f\u7528\u3057\u300190%\u304c\u30ea\u30b5\u30a4\u30af\u30eb\u539f\u6599\u3067\u69cb\u6210\u3055\u308c\u3066\u3044\u307e\u3059\uff08\u533b\u7642\u30b0\u30ec\u30fc\u30c9\u306e\u54c1\u8cea\u3092\u78ba\u4fdd\u3059\u308b\u305f\u3081\u306b10%\u306e\u30d0\u30fc\u30b8\u30f3\u7d20\u6750\u3092\u6dfb\u52a0\uff09\u30022022\u5e74\u306b\u306f\u30a2\u30a4\u30a6\u30a7\u30a2\u696d\u754c\u3067\u521d\u3081\u3066\u3001\u30a2\u30bb\u30c6\u30fc\u30c8\u306e\u5168\u4f9b\u7d66\u3092Eastman Acetate Renew\u306b\u5207\u308a\u66ff\u3048\u307e\u3057\u305f\u3002\u3053\u308c\u306fISCC PLUS\u8a8d\u8a3c\u3092\u53d6\u5f97\u3057\u305f\u7d20\u6750\u3067\u300160%\u306e\u6301\u7d9a\u53ef\u80fd\u306a\u6728\u6750\u7531\u6765\u30bb\u30eb\u30ed\u30fc\u30b9\u306840%\u306e\u8a8d\u8a3c\u6e08\u307f\u30ea\u30b5\u30a4\u30af\u30eb\u5ec3\u30d7\u30e9\u30b9\u30c1\u30c3\u30af\u304b\u3089\u4f5c\u3089\u308c\u3066\u304a\u308a\u3001\u5f93\u6765\u306e\u30a2\u30bb\u30c6\u30fc\u30c8\u3068\u6bd4\u3079\u6e29\u5ba4\u52b9\u679c\u30ac\u30b9\u3092\u6700\u592750%\u524a\u6e1b\u3057\u307e\u3059\u3002MYLON\u30d5\u30ec\u30fc\u30e0\u306fSLS\uff08\u9078\u629e\u7684\u30ec\u30fc\u30b6\u30fc\u713c\u7d50\uff09\u3068\u3044\u30463D\u30d7\u30ea\u30f3\     keyPhrases: [{

      jp: "\u30b9\u30c6\u30f3\u30ec\u30b9\u7d20\u6750\u306f90%\u304c\u30ea\u30b5\u30a4\u30af\u30eb\u539f\u6599"

  collections: [{

    descriptionJp: "MYKITA\u306e\u7279\u8a31\u53d6\u5f97\u6e08\u307f\u30d2\u30f3\u30b8\u30ec\u30b9\u8a2d\u8a08\u306b\u3088\u308b\u30b9\u30c6\u30f3\u30ec\u30b9\u30d5\u30ec\u30fc\u30e0\u3002\u30cd\u30b8\u3082\u6eb6\u63a5\u3082\u4f7f\u308f\u305a\u3001\u6298\u308a\u7d19\u306e\u3088\u3046\u306b\u5e73\u3089\u306a\u91d1\u5c5e\u677f\u304b\u3089\u5207\u308a\u51fa\u3057\u3001\u624b\u3067\u6210\u5f62\u3055\u308c\u307e\u3059\u3002",
    description: "Stainless steel frames with MYKITA's patented hingeless design \u2014 no screws, no welding. Cut from flat sheet metal like origami, then shaped by hand.",
    salesPoint: "The patented hinge you can see on the temple is MYKITA's signature. It creates a distinctive click when you close the frame.",
    salesPointJp: "\u30c6\u30f3\u30d7\u30eb\u306b\u898b\u3048\u308b\u7279\u8a31\u30d2\u30f3\u30b8\u304cMYKITA\u306e\u30c8\u30ec\u30fc\u30c9\u30de\u30fc\u30af\u3067\u3059\u3002\u30d5\u30ec\u30fc\u30e0\u3092\u9589\u3058\u308b\u3068\u72ec\u7279\u306e\u30af\u30ea\u30c3\u30af\u611f\u304c\u3042\u308a\u307e\u3059\u3002"
  }, {

    descriptionJp: "\u7279\u8a31\u53d6\u5f97\u6e08\u307f\u306eMIM\uff08\u91d1\u5c5e\u5c04\u51fa\u6210\u5f62\uff09\u30d2\u30f3\u30b8\u3092\u63a1\u7528\u3057\u305f\u8089\u539a\u306e\u30a2\u30bb\u30c6\u30fc\u30c8\u30d5\u30ec\u30fc\u30e0\u3002\u5927\u80c6\u306a\u8272\u4f7f\u3044\u3068\u5f6b\u523b\u7684\u306a\u30d5\u30a9\u30eb\u30e0\u304c\u7279\u5fb4\u3067\u3059\u3002",
    description: "Voluminous acetate frames with a patented Metal Injection Molding hinge. Bold colors and sculptural forms.",
    salesPoint: "The acetate collection offers a richer, more colorful expression \u2014 perfect for customers who want a bold statement.",
