name: Auto Merge to Main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Check if PR already exists
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null)

          if [ -z "$PR_NUMBER" ]; then
            # Create PR
            PR_NUMBER=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Auto-merge: $BRANCH" \
              --body "This PR was automatically created and will be auto-merged into main." \
              --json number --jq '.number')
          fi

          # Enable auto-merge
          gh pr merge "$PR_NUMBER" --auto --merge
